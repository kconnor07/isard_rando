# Production (Oracle Cloud ou tout VPS) : app + Caddy (HTTPS automatique).
# Prérequis : .env à la racine d'odile-engine/ (copie de .env.example rempli)
# et la variable DOMAIN (ex: engine.odileai.com) pointée en DNS vers le serveur.
#
# Le .env étant à la racine et le compose dans docker/, toute commande compose
# doit passer --env-file (sinon : « required variable DOMAIN is missing a value »).
# Le plus simple est d'utiliser les deux scripts fournis :
#
#   cd odile-engine
#   ./docker/deploy.sh                    # mettre à jour, reconstruire, redémarrer
#   ./docker/dc.sh logs --tail=40 caddy   # toute autre commande compose

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Renseigné par docker/deploy.sh : visible dans /healthz et Connexions & santé
        GIT_SHA: ${GIT_SHA:-unknown}
    env_file: ../.env
    environment:
      DATA_DIR: /data
    volumes:
      - odile-data:/data
    restart: unless-stopped
    expose:
      - '3080'

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: '${DOMAIN:?définir DOMAIN dans .env (ex. engine.odileai.com)}'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  odile-data:
  caddy-data:
  caddy-config:
